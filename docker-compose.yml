# 개발용 상시 스택. **서버에서 실행한다. 로컬에서 띄우지 않는다.**
# 설정과 운영 절차는 docs/infra.md 참조.
#
# 사용:
#   cp .env.example .env   # 값 채우기
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # 결정론: 컨테이너 타임존을 UTC로 고정한다. 애플리케이션은 timestamptz만 쓴다.
      TZ: UTC
      PGTZ: UTC
    ports:
      # 바인드 주소는 BIND_HOST(.env)로. 기본은 안전한 127.0.0.1 — 노트북에서 Twingate 로
      # 닿게 하려면 서버 .env 에 BIND_HOST=<사설 IP> (docs/infra.md §3.1). 절대 0.0.0.0 금지.
      # 호스트 포트는 .env 에서 조정한다. 컨테이너 내부는 항상 5432 다.
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest # TODO: 첫 pull 후 RELEASE 태그로 고정할 것 (docs/infra.md §4)
    container_name: archive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"     # S3 API
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001" # 웹 콘솔
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 버킷 생성 + 버전 관리 활성화. 멱등하므로 매번 up 해도 안전하다.
  minio-init:
    image: minio/mc:latest
    container_name: archive-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      BUCKET: ${S3_BUCKET:-archive}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc version enable local/$${BUCKET} &&
      echo 'bucket ready: '$${BUCKET}
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
