spring:
  application:
    name: archive

  datasource:
    # 로컬 실행 시에는 서버의 Postgres 를 바라본다. docs/infra.md §3 참조.
    # 실제 접속 정보는 application-local.yml 에 두고 커밋하지 않는다.
    # 포트는 서버의 .env 에 있는 POSTGRES_PORT 와 맞춰야 한다 (기존 Postgres 충돌로 5434 사용).
    url: ${DB_URL:jdbc:postgresql://localhost:5434/archive}
    username: ${DB_USER:archive}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 빈 DB 가 아닐 때 조용히 넘어가지 않게 한다. 스키마 표류를 즉시 드러내는 편이 낫다.
    baseline-on-migrate: false

  servlet:
    multipart:
      # W1 은 단일 파일 PUT. 청크 프로토콜은 W2 에서 들어온다 (pipeline.md).
      max-file-size: 512MB
      max-request-size: 512MB

  security:
    oauth2:
      client:
        registration:
          google:
            # client-id/secret 은 Google Cloud Console 에서 발급. 커밋 금지 —
            # application-local.yml 이나 환경변수로. 비어 있으면 기동이 실패한다(소셜 로그인
            # 자체가 자격 없이는 불가). scope 만 여기 고정.
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, email, profile

server:
  port: 8080

archive:
  storage:
    # 로컬 실행 시에는 서버의 MinIO 를 바라본다. 자격은 서버 .env 의 MINIO_ROOT_* 와 같다.
    # 실제 값은 application-local.yml 에 두고 커밋하지 않는다 (docs/infra.md §6).
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:archive}
    # MinIO 는 리전을 쓰지 않지만 SDK 가 서명 계산에 요구한다. 실제 S3 로 옮기면 여기가 바뀐다.
    region: ${S3_REGION:us-east-1}

  auth:
    # 로그인 허용 이메일(쉼표 구분). 비면 전체 허용(개발용) — 배포 전 반드시 채운다.
    # 여러 명(가족·지인) 가능. 예: ARCHIVE_ALLOWED_EMAILS=a@x.com,b@y.com
    allowed-emails: ${ARCHIVE_ALLOWED_EMAILS:}
